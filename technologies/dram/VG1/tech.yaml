# VG1_v2 (2026-10-30): dram/VG1 + the 2 nm structure fixes (WL mandrel 111:0, HCS 16 nm spacers and 20 nm mandrels, V1 covered).
# VG1 (4F2 vertical-gate DRAM, single wafer, D1a periphery; the paper's VG1): dram_temp/vg1's
# VG_CNP_steps.csv (changes 1-23) relabelled to the 2026-10-30 process areas (Ion_implantation,
# Diffusion, Wafer_clean, Resist, CMP; ashing Dry_etch; DIF oxides Diffusion), flow VG1, cut after
# ILD 3-1 SiCN Deposition as BG1.
# The flow CSV that is run (other CSVs in this folder are not read).
csv: VG1_final.csv
route: VG1
layout: VG1_layout.gds   # VG1_v2 layout: the edge fix plus the HCS1/HCS2 mandrels (370/0, 380/0) narrowed 26 -> 20 nm
clip:
  name: H2
  coords: [-0.176, -0.252, 0.316, 0.252]   # x0 y0 x1 y1 (um): 12 x 11 pillars + a 40 nm field strip at x > 0.276 for the BL edge contacts (2026-10-30)

# Set to also report carbon per die.
die_area_mm2: null

# Technology to compare with in the report (its changed and new steps are outlined), e.g. flash/baseline.
baseline: null

# svisual views for each step (tcl/svisual_render.tcl).
render:
  resolution: 1024x768
  zoom_box: null   # [x0, x1, y0, y1, z0, z1] in um; null = whole structure
  cuts: []
