# BG1 (SK Hynix D1a, 6F2 Baseline workbook flow): the former dram_temp/hynix_d1a (since removed) relabelled to the
# 2026-10-30 process areas (Ion_implantation, Diffusion, Wafer_clean, Resist, CMP).
# The flow CSV that is run (other CSVs in this folder are not read).
csv: BG1_final.csv
route: BG1
layout: BG1_layout.gds   # was dram_temp/hynix_d1a/DRAFT_hynix_d1a_layout.gds
clip:
  name: H2
  coords: [-0.174, -0.25, 0.275, 0.25]   # x0 y0 x1 y1 (um)

# Set to also report carbon per die.
die_area_mm2: null

# Technology to compare with in the report (its changed and new steps are outlined), e.g. flash/baseline.
baseline: null

# svisual views for each step (tcl/svisual_render.tcl).
render:
  resolution: 1024x768
  zoom_box: null   # [x0, x1, y0, y1, z0, z1] in um; null = whole structure
  cuts: []
